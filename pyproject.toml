[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-hunter"
version = "0.1.0"
description = "Compliant sourcing intelligence for European luxury, archive, and vintage resale."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.121",
  "uvicorn>=0.30,<0.33",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
